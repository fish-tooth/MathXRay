[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathxray"
version = "0.1.0"
description = "Hybrid Process Verification and Root-Cause Error Localization for Mathematical Reasoning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.30,<2",
    "sympy>=1.12,<2",
    "datasets>=2.19,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
